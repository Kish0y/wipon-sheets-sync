# Автоматическая синхронизация продаж Wipon в Google Таблицу.
# GitHub бесплатно запускает этот файл по расписанию на своих серверах —
# свой компьютер держать включённым не нужно.

name: Синхронизация продаж Wipon

on:
  schedule:
    # Каждые 10 минут. Время у GitHub всегда UTC, но нам это не важно:
    # часовой пояс продаж скрипт берёт из переменной TIMEZONE.
    # ВАЖНО: расписание у GitHub неточное — запуск может задержаться
    # на 10-20 минут при высокой нагрузке. Продажи не потеряются,
    # просто появятся в таблице чуть позже.
    - cron: "*/10 * * * *"
  # Позволяет запустить вручную кнопкой Run workflow на вкладке Actions.
  workflow_dispatch:

# Не даём запуститься второй копии, пока работает первая.
concurrency:
  group: wipon-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Забрать код из репозитория
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install --quiet -r requirements.txt

      - name: Проверить, что все секреты заданы
        # Без этой проверки скрипт падает с кодом 2 и невнятным сообщением.
        # Здесь мы заранее говорим, КАКОГО именно секрета не хватает.
        # Сами значения не печатаем — только имена.
        env:
          WIPON_USERNAME: ${{ secrets.WIPON_USERNAME }}
          WIPON_PASSWORD: ${{ secrets.WIPON_PASSWORD }}
          WIPON_EMPLOYEE_ID: ${{ secrets.WIPON_EMPLOYEE_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Второй аккаунт необязателен: включается, если задан WIPON_2_USERNAME.
          WIPON_2_USERNAME: ${{ secrets.WIPON_2_USERNAME }}
          WIPON_2_PASSWORD: ${{ secrets.WIPON_2_PASSWORD }}
          WIPON_2_EMPLOYEE_ID: ${{ secrets.WIPON_2_EMPLOYEE_ID }}
        run: |
          missing=""
          required="WIPON_USERNAME WIPON_PASSWORD WIPON_EMPLOYEE_ID GOOGLE_SPREADSHEET_ID GOOGLE_SERVICE_ACCOUNT_JSON"
          # Если второй аккаунт включён, его пароль и employee_id тоже обязательны.
          if [ -n "$WIPON_2_USERNAME" ]; then
            required="$required WIPON_2_USERNAME WIPON_2_PASSWORD WIPON_2_EMPLOYEE_ID"
          fi
          for name in $required; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              missing="$missing $name"
            else
              echo "  есть: $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing"
            echo "Добавьте их: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          if [ -n "$WIPON_2_USERNAME" ]; then
            echo "Все секреты на месте, аккаунтов Wipon: 2"
          else
            echo "Все секреты на месте, аккаунтов Wipon: 1 (второй не задан)"
          fi

      - name: Создать ключ сервисного аккаунта Google
        # Секрет передаём через переменную окружения, а не подставляем
        # прямо в команду: так он не попадёт в логи сборки.
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_KEY" > service_account.json
          # Убеждаемся, что это действительно ключ сервисного аккаунта,
          # а не обрезанный кусок файла. Печатаем только client_email —
          # он не секретный, зато сразу видно, тот ли ключ подставлен.
          python -c "
          import json, sys
          try:
              data = json.load(open('service_account.json', encoding='utf-8'))
          except Exception as exc:
              print('::error::Секрет GOOGLE_SERVICE_ACCOUNT_JSON — не разбирается как JSON:', exc)
              print('Скопируйте содержимое service_account.json ЦЕЛИКОМ, от { до }')
              sys.exit(1)
          if data.get('type') != 'service_account':
              print('::error::В секрете лежит не ключ сервисного аккаунта')
              sys.exit(1)
          print('ключ Google на месте, client_email =', data.get('client_email'))
          "

      - name: Синхронизировать продажи
        env:
          # --- секреты, их задаём в настройках репозитория ---
          WIPON_USERNAME: ${{ secrets.WIPON_USERNAME }}
          WIPON_PASSWORD: ${{ secrets.WIPON_PASSWORD }}
          WIPON_EMPLOYEE_ID: ${{ secrets.WIPON_EMPLOYEE_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          # Второй аккаунт Wipon. Пока секрета WIPON_2_USERNAME нет,
          # сюда подставляется пустая строка и второй аккаунт выключен.
          WIPON_2_USERNAME: ${{ secrets.WIPON_2_USERNAME }}
          WIPON_2_PASSWORD: ${{ secrets.WIPON_2_PASSWORD }}
          WIPON_2_EMPLOYEE_ID: ${{ secrets.WIPON_2_EMPLOYEE_ID }}
          # --- обычные настройки, их прятать незачем ---
          # Приставка к филиалам второго аккаунта на листе: «Алматы / Основной склад».
          # Должна совпадать с WIPON_2_NAME в локальном .env: иначе продажи
          # второго аккаунта разойдутся по двум блокам с разными приставками.
          WIPON_2_NAME: Алматы
          GOOGLE_CREDENTIALS_FILE: service_account.json
          GOOGLE_SHEET_NAME: Продажи
          # Пусто — отдельный лист сводки не ведём
          GOOGLE_SUMMARY_SHEET_NAME: ""
          # Какие товары писать в таблицу. Несколько — через точку с запятой.
          # Пустая строка означала бы «все товары».
          ITEM_FILTER: Магний 3x Nurelum
          TIMEZONE: Asia/Almaty
          # Машина GitHub одноразовая: файла state.json на ней нет,
          # поэтому от дублей защищаемся сверкой с колонкой ID в таблице.
          RECONCILE_WITH_SHEET: "1"
          # Раз состояние не сохраняется, каждый запуск берём сутки —
          # этого хватает с запасом, даже если расписание задержится.
          SYNC_DAYS_BACK: "1"
          LOG_LEVEL: INFO
        run: python wipon_sync.py

      - name: Сохранить лог, если что-то сломалось
        # Запускается только при ошибке — лог можно скачать со страницы запуска
        # и посмотреть, что именно пошло не так.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log
          path: sync.log
          retention-days: 7
